<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<title>Spirit Engineering — Business Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161b; --ink-2:#1b212a; --line:#2a323d;
    --paper:#f2ede3; --amber:#e8912a; --amber-2:#c9761a;
    --txt:#eef1f4; --muted:#9aa6b2;
    --head:64px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--txt);
    font-family:"Public Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden}

  /* ---- shell top bar ---- */
  header{height:var(--head);flex:none;display:flex;align-items:center;gap:14px;
    padding:0 16px;background:linear-gradient(180deg,#171d24,#12161b);
    border-bottom:1px solid var(--line);position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{width:38px;height:38px;flex:none;border-radius:10px;
    background:linear-gradient(135deg,var(--amber),var(--amber-2));
    color:#12161b;font-family:"Archivo";font-weight:800;font-size:17px;letter-spacing:-.5px;
    display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .wm{min-width:0}
  .wm .name{font-family:"Archivo";font-weight:700;font-size:16.5px;letter-spacing:-.3px;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wm .tag{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}

  /* ---- segmented switch ---- */
  .switch{margin-left:auto;display:flex;background:#0e1217;border:1px solid var(--line);
    border-radius:12px;padding:4px;gap:3px;flex:none}
  .switch button{font-family:"Public Sans";font-weight:600;font-size:13.5px;color:var(--muted);
    padding:8px 15px;border-radius:9px;display:flex;align-items:center;gap:8px;
    transition:background .18s,color .18s;white-space:nowrap}
  .switch button:hover{color:var(--txt)}
  .switch button[aria-pressed="true"]{background:var(--amber);color:#12161b}
  .switch button .ico{width:16px;height:16px;flex:none}
  .switch button[aria-pressed="true"] .ico{stroke:#12161b}
  .switch button .ico{stroke:currentColor}

  .sub{flex:none;height:32px;display:flex;align-items:center;gap:8px;padding:0 18px;
    background:#0e1217;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
  .sub b{color:var(--amber);font-weight:600}
  .sub .crumbs{font-family:"Public Sans"}

  /* ---- stage where the two apps live ---- */
  .stage{flex:1;position:relative;background:#0a0d10;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0d10}
  .stage iframe.off{display:none}

  .loader{position:absolute;inset:0;display:grid;place-items:center;background:#0a0d10;z-index:3;
    transition:opacity .3s}
  .loader.done{opacity:0;pointer-events:none}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--amber);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:640px){
    :root{--head:auto}
    header{height:auto;flex-wrap:wrap;padding:10px 12px;gap:10px}
    .switch{margin-left:0;width:100%}
    .switch button{flex:1;justify-content:center;padding:9px 8px}
    .wm .tag{display:none}
    .sub{display:none}
  }
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">SE</div>
      <div class="wm">
        <div class="name">Spirit Engineering</div>
        <div class="tag">Business Suite</div>
      </div>
    </div>
    <div class="switch" role="tablist" aria-label="Choose a workspace">
      <button id="tab-ops" aria-pressed="true" onclick="show('ops')">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17v-6M12 17V7M15 17v-3"/><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Operations
      </button>
      <button id="tab-sales" aria-pressed="false" onclick="show('sales')">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-4.5h15L21 9M3 9h18M3 9v9a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M8 13h8"/></svg>
        Catalog &amp; Sales
      </button>
    </div>
  </header>

  <div class="sub"><span class="crumbs" id="crumbs">Workforce · Attendance · Payroll · Cashbook · Billing</span></div>

  <div class="stage">
    <iframe id="if-ops"   title="Operations workspace"></iframe>
    <iframe id="if-sales" title="Catalog and sales workspace" class="off"></iframe>
    <div class="loader" id="loader"><div class="spin"></div></div>
  </div>

  var CRUMBS = {
    ops:  "Workforce · Attendance · Payroll · Cashbook · Billing",
    sales:"Machines · Enquiries · Quotations · Money book · Customers"
  };
  var loaded = {ops:false, sales:false};

  function blobUrl(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], {type:"text/html;charset=utf-8"}));
  }

  var loader = document.getElementById("loader");
  function mount(which, b64, frameId){
    if(loaded[which]) return;          // already loaded -> leave loader alone
    loaded[which] = true;
    loader.classList.remove("done");   // show spinner only for a genuine first load
    var f = document.getElementById(frameId);
    f.addEventListener("load", function(){ loader.classList.add("done"); }, {once:true});
    f.src = blobUrl(b64);
  }

  function show(which){
    var ops = which === "ops";
    document.getElementById("if-ops").classList.toggle("off", !ops);
    document.getElementById("if-sales").classList.toggle("off", ops);
    document.getElementById("tab-ops").setAttribute("aria-pressed", ops);
    document.getElementById("tab-sales").setAttribute("aria-pressed", !ops);
    document.getElementById("crumbs").textContent = CRUMBS[which];
    // mount lazily on first view; state then persists across switches
    if(ops) mount("ops", OPS_B64, "if-ops");
    else    mount("sales", SALES_B64, "if-sales");
  }

  // boot: Operations first
  mount("ops", OPS_B64, "if-ops");
