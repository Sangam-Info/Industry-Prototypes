<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geeta Industries — QR Catalog Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1A15; --ink2:#55503F; --ink3:#8A8471;
  --bg:#E7E9E2; --card:#FFFFFF; --sunk:#F2F3EE;
  --green:#14512F; --green2:#1E7A45; --green-ink:#0C3520;
  --orange:#DE5A14; --orange2:#B84709;
  --zinc1:#DCD9D0; --zinc2:#B5B0A2; --zinc3:#8E8877;
  --line:#D3D5CC; --line2:#C0C3B8;
  --disp:'Big Shoulders Display',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --guj:'Noto Sans Gujarati',sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body); color:var(--ink);
  background:#20241F;
  background-image:radial-gradient(circle at 20% 0%,#2C332A 0%,#1A1D18 60%);
  display:flex;flex-direction:column;align-items:center;
  padding:26px 14px 40px; gap:16px;
}
body.lang-gu{font-family:var(--guj)}
.lang-gu .disp{font-family:var(--guj)}
:lang(gu){font-family:var(--guj)}

/* ---------- desktop chrome ---------- */
.stagehead{max-width:900px;text-align:center;color:#B8BFB2;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--mono)}
.stagehead b{color:#F0EFE6;font-weight:500}
.phone{
  width:100%;max-width:412px;height:min(860px,calc(100vh - 150px));min-height:600px;
  background:var(--bg);border-radius:34px;overflow:hidden;position:relative;
  box-shadow:0 0 0 9px #14170F,0 0 0 10px #3A3F35,0 34px 70px -18px rgba(0,0,0,.75);
  display:flex;flex-direction:column;
}
.jump{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
.jump button{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#C9CFC2;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  padding:6px 11px;border-radius:99px;cursor:pointer;transition:.15s;
}
.jump button:hover{background:rgba(255,255,255,.16);color:#fff}
.jump button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- app shell ---------- */
.top{
  flex:0 0 auto;background:var(--green);color:#EDF1E9;
  padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:20;
  box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.mono-badge{
  width:34px;height:34px;flex:0 0 34px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(160deg,#F0B93B,#D98A12);color:#3B2606;
  font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.02em;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.3);
}
.top h1{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:.03em;line-height:.95}
.lang-gu .top h1{font-family:var(--guj);font-size:16px;line-height:1.2}
.top .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#A9C4AE;margin-top:2px}
.top .grow{flex:1;min-width:0}
.iconbtn{
  background:rgba(255,255,255,.1);border:0;color:#EDF1E9;width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
}
.iconbtn:active{background:rgba(255,255,255,.24)}
.iconbtn:focus-visible{outline:2px solid #F0B93B;outline-offset:2px}
.langtog{display:flex;background:rgba(0,0,0,.22);border-radius:8px;padding:2px;flex:0 0 auto}
.langtog button{
  border:0;background:transparent;color:#9FB8A4;font-size:11px;font-weight:600;
  padding:5px 8px;border-radius:6px;cursor:pointer;font-family:var(--body);
}
.langtog button.on{background:#F0B93B;color:#3B2606}
.langtog button:nth-child(1){font-family:var(--guj)}

.view{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.view::-webkit-scrollbar{width:0}
.pad{padding:16px 14px}
.pad-b{padding-bottom:104px}

/* ---------- type ---------- */
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink3);display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line2)}
.lang-gu .eyebrow{letter-spacing:.04em;font-family:var(--guj)}
h2.sec{font-family:var(--disp);font-size:27px;font-weight:700;letter-spacing:.01em;line-height:1}
.lang-gu h2.sec{font-family:var(--guj);font-size:19px;line-height:1.3}
p.lede{font-size:14.5px;line-height:1.55;color:var(--ink2)}
.code{font-family:var(--mono);font-size:11px;letter-spacing:.05em}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--green-ink);color:#E8EDE4;padding:18px 14px 20px;overflow:hidden}
.hero::before{
  content:"";position:absolute;inset:0;opacity:.16;
  background-image:repeating-linear-gradient(135deg,transparent 0 9px,#8FD6A6 9px 10px);
}
.hero-in{position:relative}
.hero h2{font-family:var(--disp);font-size:33px;line-height:.94;font-weight:800;letter-spacing:.01em;max-width:12ch}
.lang-gu .hero h2{font-family:var(--guj);font-size:21px;line-height:1.35;max-width:none}
.hero p{margin-top:9px;font-size:13.5px;line-height:1.5;color:#B7CDBC;max-width:34ch}
.hero .est{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#F0B93B;border:1px solid rgba(240,185,59,.4);border-radius:99px;padding:5px 11px;
}
.lang-gu .hero .est{font-family:var(--guj);letter-spacing:0}

/* ---------- action tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px}
.tile{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 12px;display:flex;flex-direction:column;gap:9px;cursor:pointer;
  text-align:left;font-family:inherit;color:inherit;transition:.14s;text-decoration:none;
}
.tile:active{transform:translateY(1px);border-color:var(--zinc3)}
.tile:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.tile .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);color:var(--green)}
.tile.hot .ic{background:#FCEBDF;color:var(--orange)}
.tile b{font-size:14px;font-weight:600;display:block;line-height:1.2;color:var(--ink)}
.tile span{font-size:11.5px;color:var(--ink3);display:block;margin-top:2px;line-height:1.3}

/* ---------- machine cards ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  cursor:pointer;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;
}
.mcard:active{border-color:var(--zinc3)}
.mcard:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.shot{
  aspect-ratio:1/.78;background:var(--sunk);border-bottom:1px solid var(--line);
  display:grid;place-items:center;color:var(--green);position:relative;
}
.shot svg{width:88%;height:88%}
.shot .cnt{
  position:absolute;left:7px;bottom:7px;font-family:var(--mono);font-size:9px;letter-spacing:.05em;
  background:rgba(255,255,255,.92);border:1px solid var(--line);padding:2px 6px;border-radius:5px;color:var(--ink2);
}
.mcard .mb{padding:10px 11px 12px}
.mcard b{font-size:13.5px;font-weight:600;line-height:1.25;display:block}
.mcard .mm{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.05em;margin-top:4px}
.mcard .pr{font-size:12.5px;font-weight:600;color:var(--orange);margin-top:6px}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line2);background:var(--card);border-radius:99px;
  padding:7px 13px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--ink2);
}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- gallery ---------- */
.gal{position:relative;background:var(--sunk);border-bottom:1px solid var(--line)}
.galtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.galtrack::-webkit-scrollbar{display:none}
.galslide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/.72;display:grid;place-items:center;color:var(--green)}
.galslide svg{width:76%;height:76%}
.galslide.alt{background:#EDEFE8}
.galdots{position:absolute;bottom:30px;left:0;right:0;display:flex;gap:5px;justify-content:center}
.galdots i{width:5px;height:5px;border-radius:99px;background:var(--zinc2)}
.galdots i.on{background:var(--green);width:16px}
.galtag{
  position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;background:var(--card);border:1px solid var(--line);padding:4px 8px;border-radius:6px;color:var(--ink2);
}

/* ---------- SIGNATURE: riveted spec plate ---------- */
.plate{
  margin:-22px 14px 0;position:relative;z-index:2;border-radius:9px;padding:14px 15px 13px;
  background:linear-gradient(168deg,#E4E1D8 0%,#CBC7BB 42%,#DBD8CE 60%,#B9B4A6 100%);
  box-shadow:0 4px 14px -4px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.14);
  border:1px solid #9E998A;
}
.plate::before,.plate::after{
  content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:99px;
  background:radial-gradient(circle at 33% 30%,#F4F2EC,#8A8474 70%,#6B6558);
  box-shadow:0 1px 1px rgba(0,0,0,.3);
}
.plate::before{left:8px} .plate::after{right:8px}
.plate .pr2{position:absolute;bottom:8px;width:7px;height:7px;border-radius:99px;
  background:radial-gradient(circle at 33% 30%,#F4F2EC,#8A8474 70%,#6B6558);box-shadow:0 1px 1px rgba(0,0,0,.3)}
.plate .pr2.l{left:8px} .plate .pr2.r{right:8px}
.plate .ptitle{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#5E5849;text-align:center;padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid rgba(0,0,0,.18);
}
.lang-gu .plate .ptitle{font-family:var(--guj);letter-spacing:.02em}
.plate dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;padding:0 4px}
.plate dt{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#6B6555;
  align-self:center;white-space:nowrap;
}
.lang-gu .plate dt{font-family:var(--guj);letter-spacing:0;font-size:11px}
.plate dd{
  font-family:var(--disp);font-size:19px;font-weight:700;color:#221F17;text-align:right;
  letter-spacing:.02em;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.55);
}
.lang-gu .plate dd{font-family:var(--guj);font-size:14px;font-weight:600}

/* ---------- accessory rows ---------- */
.arow{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px;cursor:pointer;margin-bottom:8px;
}
.arow:active{border-color:var(--zinc3)}
.arow:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.stencil{
  width:44px;height:44px;flex:0 0 44px;border-radius:8px;background:var(--sunk);
  border:1px dashed var(--zinc2);display:grid;place-items:center;color:var(--green);position:relative;
}
.stencil svg{width:22px;height:22px}
.stencil.big{width:64px;height:64px;flex:0 0 64px;border-radius:11px}
.stencil.big svg{width:30px;height:30px}
.arow .ab{flex:1;min-width:0}
.arow b{font-size:13.5px;font-weight:600;display:block;line-height:1.25}
.arow .pcode{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink3);margin-top:3px;display:block;
}
.arow .apr{font-size:12.5px;font-weight:600;color:var(--orange);white-space:nowrap}

/* ---------- generic blocks ---------- */
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px}
.block h3{font-family:var(--disp);font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:.01em}
.lang-gu .block h3{font-family:var(--guj);font-size:15px}
.ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.ul li{font-size:13.5px;line-height:1.5;color:var(--ink2);padding-left:18px;position:relative}
.ul li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:2px;background:var(--orange)}
.kv{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.kv:last-child{border:0;padding-bottom:0}
.kv .ic{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--green)}
.kv .kt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.lang-gu .kv .kt{font-family:var(--guj);letter-spacing:0;font-size:11px}
.kv .kd{font-size:13.5px;line-height:1.45;margin-top:3px}

/* ---------- map ---------- */
.mapbox{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#DFE3D9}
.mapbox svg{display:block;width:100%;height:150px}

/* ---------- sticky action bar ---------- */
.bar{
  position:absolute;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,rgba(231,233,226,0));
  display:flex;gap:9px;
}
.btn{
  flex:1;border:0;border-radius:11px;padding:14px 10px;font-family:inherit;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;
}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn svg{width:17px;height:17px}
.btn-call{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-ink)}
.btn-wa{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange2)}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2);box-shadow:0 3px 0 var(--line2)}
.btn:active{transform:translateY(2px);box-shadow:none}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:12px}
label.f span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
.lang-gu label.f span{font-family:var(--guj);letter-spacing:0;font-size:11px}
input.i,select.i,textarea.i{
  width:100%;border:1px solid var(--line2);background:var(--sunk);border-radius:10px;padding:12px;
  font-family:inherit;font-size:14px;color:var(--ink);
}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--green);outline-offset:0;background:#fff}
textarea.i{min-height:78px;resize:vertical}

/* ---------- owner panel ---------- */
.tabs{display:flex;gap:5px;background:var(--sunk);padding:4px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.lang-gu .tabs button{font-size:11.5px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;font-family:var(--body)}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid;white-space:nowrap}
.lang-gu .pill{font-family:var(--guj);letter-spacing:0;font-size:10px}
.pill.new{background:#FCEBDF;border-color:#E9CBAC;color:#A5450A}
.pill.called{background:#E7F0F9;border-color:#C2D7EB;color:#1F5480}
.pill.done{background:#E4F1E9;border-color:#BEDCCA;color:#1B6138}
.erow{display:block;width:100%;text-align:left;font-family:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;margin-bottom:9px}
.erow.unread{border-left:3px solid var(--orange);background:#FFFDFB}
.erow:active{border-color:var(--zinc3)}
.erow:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.erow .eh{display:flex;align-items:center;gap:8px}
.erow .eh b{flex:1;font-size:14px;font-weight:600;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .em{font-size:12.5px;color:var(--green);font-weight:500;margin-top:6px}
.erow .eq{font-size:12.5px;color:var(--ink2);line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.erow .ef{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.erow .ef .code{color:var(--ink3);flex:1}
.erow .ef .tm{font-size:11px;color:var(--ink3)}
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.empty svg{width:34px;height:34px;color:var(--zinc2);margin-bottom:12px}
.empty b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}
.empty span{font-size:13px;line-height:1.5}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.barrow .bn{flex:0 0 42%;font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{flex:1;height:9px;background:var(--sunk);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bartrack i{display:block;height:100%;background:var(--green2)}
.bartrack i.o{background:var(--orange)}
.barrow .bv{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex:0 0 auto;min-width:26px;text-align:right}
.spark{width:100%;height:96px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px}
.stat.hot{background:#FFF7F1;border-color:#EBCFB2}
.stat.hot b{color:var(--orange)}
.stat b{font-family:var(--disp);font-size:29px;font-weight:800;line-height:1;display:block;color:var(--green)}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:5px;display:block}
.lang-gu .stat span{font-family:var(--guj);letter-spacing:0;font-size:11px}
.drop{
  border:2px dashed var(--zinc2);border-radius:11px;padding:18px 12px;text-align:center;background:var(--sunk);
  cursor:pointer;margin-bottom:10px;
}
.drop svg{width:26px;height:26px;color:var(--zinc3);margin-bottom:7px}
.drop b{display:block;font-size:13.5px;font-weight:600}
.drop span{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px}
.drop.done{border-style:solid;border-color:var(--green2);background:#EDF6F0}
.drop.done svg{color:var(--green2)}
.prog{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;width:0;background:var(--green2);transition:width 1.6s linear}

/* ---------- QR poster ---------- */
.poster{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 16px;text-align:center;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.3);
}

/* ---------- state ---------- */
let lang='gu', stack=[], route='home';
const $=id=>document.getElementById(id);
const view=$('view'), bar=$('bar');
const t=k=>T[k][lang];
const L=o=>o[lang];
const gu=s=>lang==='gu'?` lang="gu"`:'';
const mach=id=>MACH.find(m=>m.id===id);
const partsFor=id=>ACC.filter(a=>a.fits.includes(id));

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- router ---------- */
function go(r,push=true){
  if(push && r!==route) stack.push(route);
  route=r;
  render();
  view.scrollTop=0;
}
function back(){ route = stack.pop() || 'home'; render(); view.scrollTop=0; }

$('backBtn').onclick=back;
document.querySelectorAll('.jump button').forEach(b=>b.onclick=()=>{
  let r=b.dataset.go;
  if(r==='owner-ins'){ window._otab='ins'; return go('owner'); }
  if(r==='owner'){ window._otab='enq'; }
  if(r.startsWith('enq:')){ window._otab='enq'; }
  go(r);
});
$('lgEn').onclick=()=>setLang('en');
$('lgGu').onclick=()=>setLang('gu');
function setLang(l){
  lang=l;
  document.body.classList.toggle('lang-gu',l==='gu');
  $('lgEn').classList.toggle('on',l==='en');
  $('lgGu').classList.toggle('on',l==='gu');
  $('brandName').textContent=t('brand');
  $('brandSub').textContent=t('brandSub');
  render();
}

function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2600);
}

/* ---------- fragments ---------- */
function machCard(m){
  return `<button class="mcard" onclick="go('machine:${m.id}')">
    <div class="shot">${ART[m.art]}<span class="cnt">${m.shots} ${t('photos')}</span></div>
    <div class="mb">
      <b${gu()}>${L(m.n)}</b>
      <div class="mm">${m.spec[0][2]}</div>
      <div class="pr">${m.pr}${STOCK[m.id]?'':` <span class="pill new" style="font-size:8px;padding:2px 5px"${gu()}>${t('outStock')}</span>`}</div>
    </div></button>`;
}
function accRow(a){
  return `<button class="arow" onclick="go('part:${a.id}')">
    <span class="stencil">${ICO[a.ic]}</span>
    <span class="ab"><b${gu()}>${L(a.n)}</b><span class="pcode">${a.code}</span></span>
    <span class="apr">${a.pr}</span>${UI.chev}</button>`;
}

    w:{en:'Just now',gu:'હમણાં જ'}, m:{en:txt,gu:txt}});
  const mn = mach(mid);

function ownIns(){

    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${i===6?'#DE5A14':'#1E7A45'}" opacity="${i===6?1:.28+i*.10}"/>
    <text x="${x+bw/2}" y="${H+13}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8" fill="#8A8471">${L(DAY7)[i]}</text>`;

  const mmax=TOPM[0][1], amax=TOPA[0][1];
  return `

/* ---------- action bar ---------- */
function renderBar(){
  const m=route.startsWith('machine:')?mach(route.split(':')[1]):null;
  if(route.startsWith('enq:')){
    const e=ENQ.find(x=>x.id===route.split(':')[1]);
    const em=mach(e.mid);
    const reply = lang==='gu'
      ? `નમસ્તે ${e.name},\n\nગીતા ઈન્ડસ્ટ્રીઝ તરફથી. તમે ${em?L(em.n):'મશીન'} વિશે પૂછ્યું હતું.`
      : `Hello ${e.name},\n\nThis is Geeta Industries. You had asked about the ${em?L(em.n):'machine'}.`;
    bar.innerHTML=`<a class="btn btn-call" href="tel:${e.ph.replace(/\s/g,'')}"${gu()}>${UI.phone} ${t('callCust')}</a>
      <a class="btn btn-wa" style="flex:0 0 auto;padding-left:18px;padding-right:18px" href="https://wa.me/91${e.ph.replace(/\D/g,'').slice(-10)}?text=${encodeURIComponent(reply)}" target="_blank" rel="noopener" aria-label="WhatsApp">${UI.wa}</a>`;
    return;
  }
  if(route==='owner'||route==='qr'){
    bar.innerHTML=`<button class="btn btn-ghost" style="width:100%" onclick="go('home')"${gu()}>${t('back')}</button>`;
    return;
  }
  let msg = waMsg();
  if(m) msg = waMsg('machine', `${L(m.n)} (${m.spec[0][2]}) — ${m.pr}`);
  else if(route.startsWith('part:')){
    const pa=ACC.find(x=>x.id===route.split(':')[1]);
    if(pa) msg = waMsg('part', `${L(pa.n)} — ${pa.code}`);
  }
  else if(route==='cats') msg = waMsg('cat');
  bar.innerHTML=`
   <a class="btn btn-call" href="tel:${SHOP.phone.replace(/\s/g,'')}"${gu()}>${UI.phone} ${t('callShop')}</a>
   <a class="btn btn-wa" style="flex:0 0 auto;padding-left:18px;padding-right:18px" href="${waLink(msg)}" target="_blank" rel="noopener" aria-label="WhatsApp">${UI.wa}</a>`;
  if(m) bar.querySelector('.btn-call').innerHTML=UI.phone+' '+t('askPrice');
}

function render(){
  const [k,arg]=route.split(':');
  let html='';
  if(k==='home') html=scHome();
  else if(k==='catalog') html=scCatalog();
  else if(k==='machine') html=scMachine(arg);
  else if(k==='parts') html=scParts(arg);
  else if(k==='part') html=scPart(arg);
  else if(k==='about') html=scAbout();
  else if(k==='enquiry') html=scEnquiry();
  else if(k==='qr') html=scQR();
  else if(k==='cats') html=scCats();
  else if(k==='owner') html=scOwner();
  else if(k==='enq') html=scEnqDetail(arg);
  view.innerHTML=`<div class="pad-b">${html}</div>`;
  $('backBtn').hidden = route==='home';
  renderBar();
  const gt=$('gt');
  if(gt){
    const dots=[...document.querySelectorAll('.galdots i')];
    gt.onscroll=()=>{const i=Math.round(gt.scrollLeft/gt.clientWidth);dots.forEach((d,j)=>d.classList.toggle('on',j===i))};
  }
}
