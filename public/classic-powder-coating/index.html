<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classic Powder Coating — Production Control System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Public+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF2F8;--card:#fff;--wash:#F6F9FD;--ink:#0B1F3A;--ink2:#2E4763;--muted:#6B7C93;--faint:#93A3B8;
--line:#DEE6F0;--line2:#C6D3E4;--blue:#1546C0;--blue-lt:#2C6BE8;--blue-soft:#E7EEFC;--blue-tint:#F2F6FE;
--saf:#E07C12;--saf-soft:#FDF0DE;--saf-line:#F3C88C;--green:#1B7A4F;--green-soft:#E3F3EA;--green-line:#A8D6BC;
--red:#B3261E;--red-soft:#FCEBEA;
--disp:'Archivo','Public Sans',sans-serif;--body:'Public Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
--sh1:0 1px 2px rgba(11,31,58,.05);--sh2:0 2px 4px rgba(11,31,58,.05),0 8px 20px rgba(11,31,58,.06);
--sh3:0 12px 34px rgba(11,31,58,.16);--ease:cubic-bezier(.22,.9,.28,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input,select,textarea{font:inherit}
::-webkit-scrollbar{width:0;height:0}
.shell{max-width:1120px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:50;background:rgba(238,242,248,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 14px}
.mark{font-family:var(--disp);font-weight:800;font-stretch:115%;font-size:16px;text-transform:uppercase;color:var(--blue);white-space:nowrap}
.mark em{font-style:normal;color:var(--faint);font-weight:600}
.hgap{flex:1}
.who{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 5px;box-shadow:var(--sh1)}
.av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:13px}
.who b{display:block;font-size:12.5px;line-height:1.2}
.who s{display:block;text-decoration:none;font-family:var(--mono);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.ghost-sm{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;box-shadow:var(--sh1)}
main{flex:1;padding:16px 14px 104px}
.view{animation:enter .3s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.stag>*{animation:enter .34s var(--ease) both}
.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}
.stag>*:nth-child(4){animation-delay:.12s}.stag>*:nth-child(5){animation-delay:.16s}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.eyebrow:before{content:'';width:14px;height:2px;background:var(--saf);border-radius:2px}
h1{font-family:var(--disp);font-weight:800;font-stretch:112%;font-size:29px;line-height:1.04;letter-spacing:-.026em}
h2{font-family:var(--disp);font-weight:700;font-stretch:108%;font-size:20px;letter-spacing:-.02em}
h3{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.015em}
.sub{color:var(--muted);font-size:13px;margin-top:7px;line-height:1.55}
.hr{height:1px;background:var(--line);margin:20px 0}
.note{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:12px}
.back{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);padding:7px 0;display:inline-block;margin-bottom:6px}
/* login */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:22px}
.brand .b1{font-family:var(--disp);font-weight:800;font-stretch:118%;font-size:26px;color:var(--blue);text-transform:uppercase}
.brand .b1 em{font-style:normal;color:var(--faint)}
.brand .b2{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:var(--sh2)}
.tabs{display:flex;background:var(--paper);border-radius:11px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;text-align:center;padding:11px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--blue);box-shadow:var(--sh1)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1px solid var(--line2);padding:13px;border-radius:10px;color:var(--ink);font-size:14px;box-shadow:var(--sh1)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.act{display:block;width:100%;padding:15px;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:700;font-size:16px;border-radius:11px;text-align:center;box-shadow:0 4px 14px rgba(21,70,192,.24);transition:.15s var(--ease);margin-top:12px}
.act:active{transform:scale(.985)}
.act.sf{background:var(--saf);box-shadow:0 4px 14px rgba(224,124,18,.28)}
.act.ghost{background:var(--card);border:1px solid var(--line2);color:var(--ink);box-shadow:var(--sh1)}
.act.gr{background:var(--green);box-shadow:0 4px 14px rgba(27,122,79,.24)}
.act[disabled]{background:var(--line);color:var(--faint);box-shadow:none;cursor:not-allowed}
.err{background:var(--red-soft);color:var(--red);border:1px solid #F0C4C1;padding:11px 13px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
/* pin */
.pindots{display:flex;gap:14px;justify-content:center;margin:18px 0 8px}
.pindots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--line2);transition:.18s var(--ease)}
.pindots i.f{background:var(--blue);border-color:var(--blue);transform:scale(1.12)}
.pindots.err{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.key{height:58px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-family:var(--disp);font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh1);transition:.1s var(--ease)}
.key:active{transform:scale(.94);background:var(--blue-soft);border-color:var(--blue)}
.key.fn{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);background:transparent;border-color:transparent;box-shadow:none}
/* tiles */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:760px){.grid2{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;position:relative;overflow:hidden;box-shadow:var(--sh1);width:100%;transition:.18s var(--ease)}
.stat:active{transform:scale(.99)}
.stat .n{display:block;font-family:var(--disp);font-weight:800;font-stretch:112%;font-size:34px;line-height:.95;letter-spacing:-.035em;color:var(--blue)}
.stat .l{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:500;line-height:1.35}
.stat .rail{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.stat.saf .n{color:var(--saf)}.stat.saf .rail{background:var(--saf)}
.stat.saf{border-color:var(--saf-line);background:var(--saf-soft)}
.stat.gr .n{color:var(--green)}.stat.gr .rail{background:var(--green)}
/* rows */
.rows{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh1);transition:.18s var(--ease)}
.row:active{transform:scale(.99);background:var(--wash)}
.row .no{font-family:var(--mono);font-size:16px;min-width:44px;color:var(--blue)}
.row .mid{flex:1;min-width:0}
.row .t1{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:3px;margin-top:8px}
.seg i{height:4px;flex:1;max-width:34px;border-radius:2px;background:var(--line2)}
.seg i.a{background:var(--saf)}.seg i.d{background:var(--green)}
.chev{color:var(--faint);font-size:18px}
.sd{width:26px;height:26px;flex:none;border-radius:8px;border:1px solid rgba(11,31,58,.13)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.pill.saf{background:var(--saf-soft);color:#B85F0C}.pill.gr{background:var(--green-soft);color:var(--green)}
.pill.gy{background:var(--line);color:var(--muted)}
/* tally */
.kbar{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--sh1)}
.kbar .kn{font-family:var(--mono);font-size:16px;color:var(--blue)}
.kbar .ks{font-size:11.5px;color:var(--muted);font-weight:500}
.kbar .kc{margin-left:auto;font-family:var(--disp);font-weight:800;font-size:18px;color:var(--saf);white-space:nowrap}
.kbar .kc.ok{color:var(--green)}
.prog{width:100%;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--saf);border-radius:3px;transition:width .55s var(--ease)}
.prog i.ok{background:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}.tile .art{height:110px}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:13px;position:relative;overflow:hidden;width:100%;box-shadow:var(--sh1);transition:transform .12s var(--ease),border-color .2s}
.tile:active{transform:scale(.965)}
.lvl{position:absolute;left:0;bottom:0;width:100%;background:var(--saf-soft);z-index:0;transition:height .55s var(--ease),background .3s}
.tile.full .lvl{background:var(--green-soft)}
.tile>*:not(.lvl){position:relative;z-index:1}
.tile .art{display:flex;height:80px;align-items:center;justify-content:center;border-bottom:1px solid var(--line);position:relative;background:var(--wash)}
.tile .art .ph{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;
 color:var(--faint);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.tile .art svg{width:70%;height:54%}
.tile .meta{display:block;padding:10px 12px 12px}
.tile .nm{display:block;font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ct{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1;margin-top:6px;display:flex;align-items:baseline;gap:2px;letter-spacing:-.035em}
.tile .ct s{text-decoration:none;color:var(--faint);font-size:16px;font-weight:600}
.tile .badge{position:absolute;right:10px;bottom:12px;font-family:var(--mono);font-size:9.5px;padding:5px 8px;border-radius:999px;text-transform:uppercase;background:var(--line);color:var(--ink2)}
.tile.short{border-color:var(--saf-line);box-shadow:0 2px 12px rgba(224,124,18,.16)}
.tile.short .badge{background:var(--saf);color:#fff}
.tile.full{border-color:var(--green-line)}
.tile.full .badge{background:var(--green);color:#fff}.tile.full .ct{color:var(--green)}
.minus{position:absolute;left:9px;top:9px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card);box-shadow:var(--sh1);border:1px solid var(--line);z-index:2}
.pop{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(1)}28%{transform:scale(1.2)}60%{transform:scale(.97)}100%{transform:scale(1)}}
/* panels */
.pn{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px 14px;margin-top:12px;box-shadow:var(--sh1)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv dt{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;padding-top:2px}
.kv dd{text-align:right;font-weight:600}
.masked{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--paper);border:1px dashed var(--line2);padding:4px 9px;border-radius:6px}
.tl{margin-top:6px;position:relative}
.tl:before{content:'';position:absolute;left:6px;top:18px;bottom:22px;width:2px;background:var(--line)}
.tl .st{display:flex;gap:14px;padding:12px 0}
.tl .st>span:last-child{flex:1}
.tl .bulb{width:14px;height:14px;flex:none;margin-top:3px;border-radius:50%;border:2px solid var(--line2);background:var(--card);position:relative;z-index:1}
.tl .st.d .bulb{background:var(--green);border-color:var(--green)}
.tl .st.a .bulb{background:var(--saf);border-color:var(--saf);box-shadow:0 0 0 5px var(--saf-soft)}
.tl .st.x{opacity:.45}
.tl .nmm{display:block;font-family:var(--disp);font-weight:700;font-size:15.5px}
.tl .dt{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
/* shades */
.shades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(min-width:620px){.shades{grid-template-columns:repeat(6,1fr)}}
.sh{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;width:100%;box-shadow:var(--sh1);transition:.18s var(--ease)}
.sh:active{transform:scale(.97)}
.sh.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.sh .sw{display:block;height:50px;position:relative}
.sh .cnt{position:absolute;right:6px;top:6px;background:var(--card);color:var(--blue);font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:999px;box-shadow:var(--sh1)}
.sh .cnt.z{color:var(--faint)}
.sh .lb{display:block;padding:8px 10px 10px}
.sh .cd{display:block;font-family:var(--mono);font-size:13.5px}
.sh .nmz{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
/* table */
.tb{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh1)}
.tb th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;background:var(--wash);border-bottom:1px solid var(--line);font-weight:600}
.tb td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tb tr:last-child td{border-bottom:none}
.tb td.m{font-family:var(--mono);font-size:12px}
.tb .cop{color:var(--saf);font-weight:600}.tb .stl{color:var(--muted)}.tb .bl{color:var(--blue);font-weight:600}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:55;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);max-width:1120px;margin:0 auto}
nav button{flex:1;padding:10px 3px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9.5px;color:var(--faint);font-weight:500;position:relative}
nav button.on{color:var(--blue)}
nav button.on:before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(11,31,58,.44);backdrop-filter:blur(2px);z-index:70;opacity:0;pointer-events:none;transition:opacity .24s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--card);border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .32s var(--ease);max-height:88vh;overflow-y:auto;max-width:1120px;margin:0 auto;box-shadow:var(--sh3)}
.sheet.on{transform:translateY(0)}
.grip{width:40px;height:4px;background:var(--line2);border-radius:3px;margin:0 auto 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:12.5px;padding:9px 13px;border:1px solid var(--line2);border-radius:999px;color:var(--ink2);background:var(--card);font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.miss{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-size:13.5px;background:var(--saf-soft);border:1px solid var(--saf-line);border-radius:10px;margin-top:8px}
.miss b{font-family:var(--mono);color:var(--saf)}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:11px;font-size:13.5px}
.mrow:active{background:var(--wash)}
.mrow.on{border-color:var(--blue);background:var(--blue-tint)}
.mrow .mk{font-family:var(--mono);font-size:11px;color:var(--blue);min-width:46px}
/* misc */
#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);z-index:90;background:var(--ink);color:#fff;font-size:12.5px;padding:13px 17px;border-radius:11px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .26s var(--ease);box-shadow:var(--sh3)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
#stamp{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(238,242,248,.85);backdrop-filter:blur(3px)}
#stamp.on{display:flex}
#stamp .s{text-align:center;animation:stampin .55s var(--ease) both}
#stamp .ring{width:104px;height:104px;border-radius:50%;border:4px solid var(--green);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--sh3)}
#stamp svg{width:48px;height:48px;stroke:var(--green);fill:none;stroke-width:3.4;stroke-dasharray:44;stroke-dashoffset:44;animation:draw .45s .16s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes stampin{0%{transform:scale(1.45) rotate(-6deg);opacity:0}55%{transform:scale(.97);opacity:1}100%{transform:scale(1);opacity:1}}
#stamp .t{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:-.025em}
#stamp .u{font-size:13px;color:var(--muted);margin-top:6px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.shot{aspect-ratio:1;background:var(--card);border:1.5px dashed var(--line2);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--faint);font-size:10px;font-weight:600;transition:.2s var(--ease)}
.shot.set{border-style:solid;border-color:var(--blue);color:var(--blue);background:var(--blue-tint);animation:pop .38s var(--ease)}
.shot svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
.tog{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line2);border-radius:11px;width:100%;box-shadow:var(--sh1);font-size:13.5px;font-weight:500;margin-top:12px}
.tog i{width:46px;height:26px;border-radius:999px;background:var(--line2);flex:none;position:relative;transition:background .24s var(--ease)}

/* ═══════════════════════════════════════════════════════════════════
   DATA LAYER — Firebase Authentication + Cloud Firestore

   Everything below reads and writes real, shared data. Two people on
   two phones see the same thing, and a change made by one appears on
   the other's screen within a second.

 clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2800);}

 s.classList.add('on');setTimeout(()=>{s.classList.remove('on');cb&&cb();},1150);}

/* ── login screen ─────────────────────────────────────────────── */
function vLogin(){
 return `<div class="loginwrap"><div class="loginbox">

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const fs    = getFirestore(fbApp, FIRESTORE_DB_ID);
const storage = getStorage(fbApp);

/* A second connection, used only when the owner creates a new login.
   Without this, creating a user would sign the owner out and sign them
   in as the person they just created. */
const seedApp  = initializeApp(firebaseConfig, 'secondary');
const seedAuth = getAuth(seedApp);

/* ── the local cache every screen reads from ─────────────────────── */
const DB = { users:[], drivers:[], parties:[], series:[], items:[], shades:[],
             pickups:[], arrivals:[], lots:[], log:[], counter:0, session:null };

const SERIES_ORDER = ['15mm','25mm','35mm','Others'];
let ME = null;              // { uid, name, role, phone }
let unsubs = [];
let ready = false;

/* ── helpers the screens use ─────────────────────────────────────── */
const me = () => ME;
const rid = () => Math.random().toString(16).slice(2,9);
const clock = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const today = () => new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
const party  = id => DB.parties.find(p => p.id === id) || { name:'Unknown', address:'' };
const driver = id => DB.drivers.find(d => d.id === id) || { name:'Unknown' };
const shade  = c  => DB.shades.find(s => s.code === c) || { code:c, name:'', hex:'#999' };

const MATRIX = {
  owner:      ['party.view','inward.create','lot.view','tally.write','stage.lock','driver.assign','master.write','report.view','export','delete','admin'],
  supervisor: ['inward.create','lot.view','tally.write','stage.lock','master.write','report.view'],
  operator:   ['lot.view','tally.write'],
  viewer:     ['lot.view','report.view'],
  driver:     ['trip.record']
};
const can = a => !!(ME && (MATRIX[ME.role] || []).includes(a));

/* BR3 — customer names: owner always, a driver only on his own open trip */
function seeParty(lot){
  if (!ME) return false;
  if (ME.role === 'owner') return true;
  if (ME.role === 'driver' && lot && lot.delivery && lot.delivery.driverUid === ME.uid && !lot.delivery.receiver) return true;
  return false;
}
const partyName = lot => seeParty(lot) ? party(lot.party).name : 'Party masked';

const stagesOf = l => l.wooden ? ['wash','powder','wood'] : ['wash','powder'];
const nextStage = l => { const a = stagesOf(l), i = a.indexOf(l.stage); return (i>=0 && i+1<a.length) ? a[i+1] : 'out'; };
const countsFor = l => (l.counts && l.counts[l.stage]) || {};
const doneOf  = l => { const c = countsFor(l); return l.items.reduce((s,i)=>s+(c[i.id]||0),0); };
const totalOf = l => l.items.reduce((s,i)=>s+i.qty,0);

/* ── audit trail (BR9) ───────────────────────────────────────────── */
async function logIt(action, detail){
  try{
    await addDoc(collection(fs,'activity'), {
      who: ME ? ME.name : 'system', uid: ME ? ME.uid : null,
      action, detail: detail || '', createdAt: serverTimestamp(),
      at: new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})
    });
  }catch(e){ console.warn('activity log:', e.message); }
}

/* ── live subscriptions ──────────────────────────────────────────── */
function listen(){
  stopListening();
  const sub = (name, q, map) => unsubs.push(onSnapshot(q,
    snap => { DB[name] = snap.docs.map(map); if (ready) render(); },
    err  => console.warn(name + ':', err.code)));

  sub('shades',   collection(fs,'shades'),    d => ({ code:d.id, ...d.data() }));
  sub('items',    collection(fs,'materials'), d => ({ id:d.id, ...d.data() }));
  sub('lots',     query(collection(fs,'lots'), orderBy('inwardNo','desc')),
      d => ({ id:d.id, no:d.data().inwardNo, ...d.data() }));
  sub('arrivals', collection(fs,'arrivals'),  d => ({ id:d.id, ...d.data() }));
  sub('pickups',  collection(fs,'pickups'),   d => ({ id:d.id, ...d.data() }));

  if (can('party.view'))
    sub('parties', collection(fs,'parties'), d => ({ id:d.id, ...d.data() }));

  if (can('admin')){
    unsubs.push(onSnapshot(collection(fs,'users'), snap => {
      const all = snap.docs.map(d => ({ id:d.id, uid:d.id, ...d.data() }));
      DB.users   = all.filter(u => u.role !== 'driver');
      DB.drivers = all.filter(u => u.role === 'driver').map(u => ({ ...u, id:u.uid }));
      if (ready) render();
    }, e => console.warn('users:', e.code)));
    sub('log', query(collection(fs,'activity'), orderBy('createdAt','desc'), limit(60)),
        d => ({ id:d.id, ...d.data() }));
  } else {
    /* Non-owners still need driver names on screen, so a slim public
       list is kept in meta/drivers. It carries names only — no PINs. */
    unsubs.push(onSnapshot(doc(fs,'meta','drivers'), s => {
      DB.drivers = (s.exists() ? s.data().list : []) || [];
      if (ready) render();
    }, e => console.warn('driver list:', e.code)));
  }

  unsubs.push(onSnapshot(doc(fs,'meta','counter'),
    s => { DB.counter = s.exists() ? s.data().inwardNo : 0; },
    e => console.warn('counter:', e.code)));

  DB.series = SERIES_ORDER.map((n,i) => ({ id:'s'+(i+1), name:n }));
}
function stopListening(){ unsubs.forEach(u => { try{u();}catch{} }); unsubs = []; }

/* ── sign in / out ───────────────────────────────────────────────── */
const driverEmail = phone => String(phone).replace(/\D/g,'') + '@' + DRIVER_EMAIL_DOMAIN;
const driverPass  = pin   => String(pin) + DRIVER_PIN_SUFFIX;

async function staffLogin(){
  const raw = ($('lu').value || '');
  const u = raw.replace(/\s+/g,'').toLowerCase();
  const p = $('lp').value || '';
  if (!u){ S.err = 'Type your username in the box — "owner" is only a hint, not a value'; render(); return; }
  if (!p){ S.err = 'Enter your password'; render(); return; }
  const email = u.includes('@') ? u : u + '@cpc.local';
  try{
    await signInWithEmailAndPassword(auth, email, p);
  }catch(e){
    S.err = (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
      ? 'Wrong username or password'
      : 'Could not sign in — ' + e.code + '  (tried: ' + email + ')';
    render();
  }
}
async function pinTap(k){
  if (S.pin.length >= 4) return;
  S.pin += k; S.pinErr = false;
  if (S.pin.length === 4){
    const d = driver(S.pinDriver);
    try{
      await signInWithEmailAndPassword(auth, driverEmail(d.phone), driverPass(S.pin));
      S.pin = '';
    }catch{
      S.pinErr = true;
      setTimeout(() => { S.pin=''; S.pinErr=false; render(); }, 650);
    }
  }
  render();
}
async function signOut(){ LAST_ISSUED = null; stopListening(); ME = null; S.pin=''; S.pinDriver=null; S.tab='staff'; await fbSignOut(auth); }

onAuthStateChanged(auth, async user => {
  if (!user){ ME = null; ready = true; render(); return; }
  try{
    const snap = await getDoc(doc(fs,'users',user.uid));
    if (!snap.exists()){ S.err = 'This login has no role assigned. Ask the owner to set it up.'; await fbSignOut(auth); return; }
    const d = snap.data();
    if (d.active === false){ S.err = 'This login has been disabled.'; await fbSignOut(auth); return; }
    ME = { uid:user.uid, name:d.name, role:d.role, phone:d.phone||'' };
    listen(); ready = true; S.view='home'; render();
    setTimeout(render, 900);   // second paint once the first data lands
  }catch(e){
    S.err = 'Could not load your profile — ' + e.code; await fbSignOut(auth);
  }
});

/* ── writes ──────────────────────────────────────────────────────── */

async function doCollect(){
  const p = DB.pickups.find(x => x.id === S.trip), d = S.draft;
  try{
    /* Reserve the id first, so the photos have a folder to live in. */
    const ref = doc(collection(fs,'arrivals'));
    toast('Sending photos…');
    const photos = await uploadShots('arrivals/' + ref.id, d.shots);
    await setDoc(ref, {
      party: p.party, partyName: party(p.party).name, driverUid: ME.uid, driverName: ME.name,
      vehicle: d.vehicle.trim(), challan: d.challan.trim(), photos,
      note: d.note.trim(), status: 'pending', at: clock(), recordedAt: serverTimestamp()
    });
    await updateDoc(doc(fs,'pickups',p.id), { status:'collected' });
    await logIt('Recorded a collection', party(p.party).name);
    S.draft = null;
    stamp('Collection recorded', party(p.party).name + ' — awaiting plant verification', () => go('home'));
  }catch(e){
    S.err = e.message || ('Could not save — ' + e.code);
    toast(S.err, true);
    alert('NOT SAVED\n\n' + S.err + '\n\nYour photos are still on this screen. Fix the problem and press Record collection again.');
  }
}

/* BR1 + BR2 — the only place an inward number is created */
async function verifyLoad(){
  if (!can('inward.create')){ toast('Only a supervisor or the owner can do this', true); return; }
  const a = DB.arrivals.find(x => x.id === S.arr), d = S.draft;
  try{
    const no = await runTransaction(fs, async tx => {
      const ref  = doc(fs,'meta','counter');
      const snap = await tx.get(ref);
      const next = (snap.exists() ? snap.data().inwardNo : 546) + 1;
      tx.update(ref, { inwardNo: next });
      tx.set(doc(fs,'lots',String(next)), {
        inwardNo: next, party: a.party, vehicle: a.vehicle, challan: a.challan,
        photos: a.photos || [],
        shadeCode: d.shade, shade: d.shade, wooden: d.wooden ? 1 : 0, stage: 'wash',
        verifiedBy: ME.name, verifiedByUid: ME.uid, arrivalId: a.id,
        items: d.items.map(i => ({ ...i })), counts: {}, locks: {},
        shortfalls: [], delivery: null, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
      return next;
    });
    await updateDoc(doc(fs,'arrivals',a.id), { status:'verified', inwardNo:no });
    await logIt('Generated inward number', 'Lot ' + INW(no) + ' · ' + d.items.length + ' items');
    S.draft = null; go('created', { lot:no });
  }catch(e){ toast('Could not create the inward — ' + e.code, true); }
}

async function doWalkin(){
  const d = S.draft;
  try{
    const ref = doc(collection(fs,'arrivals'));
    toast('Sending photos…');
    const photos = await uploadShots('arrivals/' + ref.id, d.shots);
    await setDoc(ref, {
      party: d.party, partyName: party(d.party).name, driverUid: null, driverName: '—',
      vehicle: d.vehicle.trim(), challan: d.challan.trim(), photos,
      note: 'Delivered by the customer', status:'pending', at: clock(), recordedAt: serverTimestamp()
    });
    await logIt('Recorded walk-in material', party(d.party).name);
    S.draft = null; go('gate'); toast('Added to the gate queue');
  }catch(e){ toast(e.message || ('Could not save — ' + e.code), true); }
}

/* BR6 — counts are per stage */
async function bump(itemId, dir){
  if (!can('tally.write')){ toast('Your role does not allow this', true); return; }
  const l = DB.lots.find(x => x.no === S.lot);
  const item = l.items.find(i => i.id === itemId);
  const cur = (l.counts && l.counts[l.stage] && l.counts[l.stage][itemId]) || 0;
  const val = Math.max(0, Math.min(item.qty, cur + dir));
  l.counts = l.counts || {}; l.counts[l.stage] = l.counts[l.stage] || {};
  l.counts[l.stage][itemId] = val;                     // paint immediately
  S.bumped = dir > 0 ? itemId : null; render(); S.bumped = null;
  try{
    await updateDoc(doc(fs,'lots',String(l.no)), {
      ['counts.' + l.stage + '.' + itemId]: val, updatedAt: serverTimestamp()
    });
  }catch(e){ toast('Not saved — ' + e.code, true); }
}

/* BR4, BR5, BR7, BR9 */
async function doLock(){
  if (!can('stage.lock')){ toast('Only a supervisor can lock a stage', true); return; }
  const l = DB.lots.find(x => x.no === S.lot), st = l.stage, c = countsFor(l);
  if (l.locks && l.locks[st]){ toast('That stage is already locked', true); return; }   // BR5
  const shortfalls = (l.shortfalls || []).concat(
    l.items.filter(i => (c[i.id]||0) < i.qty).map(i => ({
      stage: st, item: i.name + ' · ' + i.len, qty: i.qty - (c[i.id]||0),
      reason: S.reason, by: ME.name, date: today()
    })));
  const nxt = nextStage(l);
  const counts = { ...(l.counts||{}) };
  if (nxt !== 'out') counts[nxt] = {};                                                  // BR6
  try{
    await updateDoc(doc(fs,'lots',String(l.no)), {
      ['locks.' + st]: { by: ME.name, uid: ME.uid, at: clock() },                        // BR9
      stage: nxt, counts, shortfalls, updatedAt: serverTimestamp()
    });
    await logIt('Locked a stage', 'Lot ' + INW(l.no) + ' · ' + STAGE_NAME[st]);
    closeSheet();
    stamp(nxt === 'out' ? 'Lot complete' : STAGE_NAME[st] + ' locked',
          nxt === 'out' ? `Lot ${INW(l.no)} is ready to dispatch` : `Lot ${INW(l.no)} moved to ${STAGE_NAME[nxt]}`,
          () => go(ME.role === 'operator' ? 'home' : 'lot', { lot:l.no }));
  }catch(e){ toast('Could not lock — ' + e.code, true); }
}

/* ══ PHOTOS ═══════════════════════════════════════════════════════
   The whole point of the system: the challan and the material are
   photographed once, tied to the inward number, and never touch a
   chat group again.

   Every image is shrunk to roughly 150 KB before it is uploaded, so
   about 60,000 photos fit inside the free 10 GB — two to three years
   for a unit this size. */

function pickFile(){
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
    inp.onchange = () => resolve(inp.files && inp.files[0] ? inp.files[0] : null);
    inp.click();
  });
}

async function shrink(file, maxPx = 1400, targetKB = 150){
  const img = await createImageBitmap(file);
  let w = img.width, h = img.height;
  if (Math.max(w,h) > maxPx){ const r = maxPx / Math.max(w,h); w = Math.round(w*r); h = Math.round(h*r); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  let q = 0.82, blob = null;
  for (let i = 0; i < 6; i++){
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (blob && blob.size / 1024 <= targetKB) break;
    q -= 0.12;
  }
  return blob;
}

async function capturePhoto(kind){
  const f = await pickFile();
  if (!f) return;
  toast('Preparing the photo…');
  try{
    const blob = await shrink(f);
    S.draft = S.draft || {};
    S.draft.shots = S.draft.shots || {};
    S.draft.shots[kind] = { blob, url: URL.createObjectURL(blob), kb: Math.round(blob.size/1024) };
    render();
    toast(kind + ' photo ready · ' + S.draft.shots[kind].kb + ' KB');
  }catch(e){ toast('Could not read that photo', true); }
}

const shotCount = d => d && d.shots ? Object.keys(d.shots).length : 0;

/* Inward numbers read as three digits — 001, 047, 552 — as on the
   client's paper register. The stored value stays a plain number so
   it can still be compared and stepped up. */
const INW = n => String(n ?? '').padStart(3, '0');

async function uploadShots(basePath, shots){
  const out = [];
  for (const kind of Object.keys(shots || {})){
    const s = shots[kind];
    if (!s || !s.blob) continue;
    const path = basePath + '/' + kind + '.jpg';
    try{
      const r = sref(storage, path);
      await uploadBytes(r, s.blob, { contentType: 'image/jpeg' });
      out.push({ kind, path, url: await getDownloadURL(r), kb: s.kb });
    }catch(e){
      /* A photo that does not arrive is the whole point of the system
         failing, so say so loudly rather than saving an empty record. */
      const why = (e.code === 'storage/unauthorized')
        ? 'Firebase Storage is refusing the upload. The owner must switch Storage on and publish storage.rules.'
        : (e.code === 'storage/unknown' || /retry-limit|network/i.test(e.code||''))
          ? 'The photo could not be sent — check the signal and try again.'
          : 'Photo upload failed (' + (e.code || e.message) + ')';
      throw new Error(why);
    }
  }
  return out;
}

/* A tile that captures, then shows what was captured. */
function shotTile(kind, label){
  const s = S.draft && S.draft.shots ? S.draft.shots[kind] : null;
  return s
    ? `<button class="shot set" style="padding:0;overflow:hidden;position:relative" onclick="capturePhoto('${kind}')">
        <img src="${s.url}" style="width:100%;height:100%;object-fit:cover">
        <span style="position:absolute;left:0;right:0;bottom:0;background:rgba(11,31,58,.72);color:#fff;
          font-size:9.5px;padding:4px 5px;font-family:var(--mono)">${label} · ${s.kb} KB</span></button>`
    : `<button class="shot" onclick="capturePhoto('${kind}')">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M9 6l1.5-2h3L15 6"/></svg>${label}</button>`;
}

/* Stored photos, on the job card and the verification screen. */
function shotStrip(photos){
  if (typeof photos === 'number')
    return '<div class="note">This record was made before photos were switched on.</div>';
  if (!Array.isArray(photos) || !photos.length)
    return '<div class="note">No photos on this record.</div>';
  return `<div class="shots">${photos.map(p => `<button class="shot set" style="padding:0;overflow:hidden;position:relative"
    onclick="openPhoto('${p.url}','${esc(p.kind)}')">
    <img src="${p.url}" style="width:100%;height:100%;object-fit:cover">
    <span style="position:absolute;left:0;right:0;bottom:0;background:rgba(11,31,58,.72);color:#fff;
      font-size:9.5px;padding:4px 5px;font-family:var(--mono)">${esc(p.kind)}</span></button>`).join('')}</div>`;
}
function openPhoto(url, kind){
  openSheet(`<div class="eyebrow">${esc(kind)}</div>
   <img src="${url}" style="width:100%;border-radius:12px;margin-top:8px">
   <a class="act ghost" style="display:block;text-decoration:none" href="${url}" target="_blank" rel="noopener">Open full size</a>`);
}

 const l=DB.lots.find(x=>x.no===S.lot);
 S.draft=S.draft||{shots:{},receiver:''};
 return `<button class="back" onclick="go('home')">‹ My trips</button>
 <div class="eyebrow">Delivery</div><h1>Lot ${INW(l.no)}</h1>
 <p class="sub">${esc(partyName(l))} · ${esc(party(l.party).address)}</p>
 <div class="pn"><div class="kv"><dt>Items</dt><dd>${l.items.length} · ${totalOf(l)} pieces</dd></div>
  <div class="kv"><dt>Shade</dt><dd>${l.shade} ${esc(shade(l.shade).name)}</dd></div>
  <div class="kv"><dt>Challan</dt><dd style="font-family:var(--mono);font-weight:400">${esc(l.challan)}</dd></div></div>
 <div class="fld" style="margin-top:16px"><label>Proof of delivery photo</label>
  <div class="shots" style="grid-template-columns:1fr">${shotTile('pod','Photo at delivery')}</div></div>
 <div class="fld"><label>Received by</label>
  <input value="${esc(S.draft.receiver)}" placeholder="Name of the person receiving" oninput="S.draft.receiver=this.value"></div>
 <button class="act" ${shotCount(S.draft)&&S.draft.receiver.trim()?'':'disabled'} onclick="doDeliver()">
  ${shotCount(S.draft)&&S.draft.receiver.trim()?'Complete delivery':'Add photo and receiver name'}</button>`;

/* ══ GATE QUEUE + VERIFICATION (BR1) ══ */
function arrivalRow(a){
 const ph = Array.isArray(a.photos) ? a.photos : [];
 return `<div class="row" style="border-left:4px solid var(--saf);display:block">
  <button style="display:flex;gap:12px;width:100%;align-items:center" onclick="go('verify',{arr:'${a.id}'})">
   <span class="mid"><span class="pill saf">Awaiting count</span>
   <span class="t1" style="margin-top:8px">${can('party.view')?esc(party(a.party).name):'Collected load'}</span>
   <span class="t2">${esc(driver(a.driverUid||a.driver).name)} · ${esc(a.vehicle)} · challan ${esc(a.challan||'—')} · ${esc(a.at)}</span>
   ${a.note?`<span class="t2">Driver note: ${esc(a.note)}</span>`:''}</span><span class="chev">›</span></button>
  ${ph.length ? `<div style="display:flex;gap:6px;margin-top:10px">${ph.map(p=>`
     <button style="width:58px;height:58px;border-radius:9px;overflow:hidden;border:1px solid var(--line);padding:0"
      onclick="event.stopPropagation();openPhoto('${p.url}','${esc(p.kind)}')">
      <img src="${p.url}" style="width:100%;height:100%;object-fit:cover"></button>`).join('')}
     <span style="align-self:center;font-size:11.5px;color:var(--muted);margin-left:4px">${ph.length} photo${ph.length>1?'s':''} from the driver</span></div>`
   : `<div class="note" style="margin-top:8px">No photos on this load.</div>`}
 </div>`;
}
function vGate(){
 const q=DB.arrivals.filter(a=>a.status==='pending');
 return `<div class="eyebrow">Awaiting verification</div><h1>Loads at<br>the gate</h1>
 <p class="sub">Material collected by your drivers, not yet counted. An inward number is created only after a supervisor verifies the load.</p>
 <div class="rows stag" style="margin-top:16px">${q.map(arrivalRow).join('')||'<div class="empty">No loads waiting. Everything collected has been counted in.</div>'}</div>
 ${can('inward.create')?`<button class="act ghost" onclick="go('walkin')">+ Walk-in material (no driver)</button>`:''}`;
}
function vVerify(){
 const a=DB.arrivals.find(x=>x.id===S.arr);
 S.draft=S.draft||{items:[],shade:'506',wooden:0};
 const d=S.draft;
 return `<button class="back" onclick="S.draft=null;go('gate')">‹ Loads at the gate</button>
 <div class="eyebrow">Verify the load</div>
 <h1 style="font-size:25px">${can('party.view')?esc(party(a.party).name):'Collected load'}</h1>
 <p class="sub">${can('party.view')?esc(party(a.party).address):'Party masked for your role — verify against the challan and the photos.'}</p>
 <div class="pn">
  <div class="kv"><dt>Collected by</dt><dd>${esc(driver(a.driver).name)}</dd></div>
  <div class="kv"><dt>Vehicle</dt><dd style="font-family:var(--mono);font-weight:400">${esc(a.vehicle)}</dd></div>
  <div class="kv"><dt>Party challan</dt><dd style="font-family:var(--mono);font-weight:400">${esc(a.challan||'—')}</dd></div>
  <div class="kv"><dt>Recorded at</dt><dd>${esc(a.at)}</dd></div>
  ${a.note?`<div class="kv"><dt>Driver note</dt><dd style="font-weight:400">${esc(a.note)}</dd></div>`:''}</div>
 <div style="margin-top:12px">${shotStrip(a.photos)}</div>
 <div class="note">Photos taken by the driver at the customer's premises. Tap one to see it full size, and check the material against it as you count.</div>
 <div class="hr"></div>
 <div class="eyebrow">Count the material in</div>
 <div class="ilist">${d.items.map((i,n)=>`<div class="itm"><span class="in">${esc(i.name)}
  <span style="display:block;font-size:11.5px;color:var(--muted);font-weight:400">${esc(i.len)}</span></span>
  <span class="iq">${i.qty} pcs</span><button class="rm" onclick="S.draft.items.splice(${n},1);render()">×</button></div>`).join('')}</div>
 <button class="act ghost" style="margin-top:0" onclick="pickItem()">+ Add from material master</button>
 <div class="fld" style="margin-top:18px"><label>Shade confirmed with the party</label>
  <div class="shades" style="margin-top:0">${DB.shades.slice(0,6).map(s=>`<button class="sh ${d.shade===s.code?'on':''}"
   onclick="S.draft.shade='${s.code}';render()"><span class="sw" style="background:${s.hex};height:38px"></span>
   <span class="lb" style="padding:7px 9px 9px"><span class="cd">${s.code}</span></span></button>`).join('')}</div></div>
 <button class="tog ${d.wooden?'on':''}" onclick="S.draft.wooden=S.draft.wooden?0:1;render()"><i></i><span>Wooden coating required</span></button>
 <button class="act" ${d.items.length?'':'disabled'} onclick="verifyLoad()">
  ${d.items.length?'Confirm load and generate inward number':'Count at least one item'}</button>
 <div class="callout b">The inward number is created at this moment, from the count you have just confirmed — not from what was recorded in the field.</div>`;
}
function pickItem(){
 openSheet(`<div class="eyebrow">Material master</div><h2>Add an item</h2>
 <p class="sub">Around 70% of your sections are already in the library.</p>
 <div class="mlist" style="max-height:44vh;overflow-y:auto">${DB.items.map(i=>`<button class="mrow" onclick="pickQty('${i.id}')">
  <span class="mk">${esc(i.code)}</span><span><b>${esc(i.name)}</b>
  <span style="display:block;font-size:11.5px;color:var(--muted)">${esc((DB.series.find(s=>s.id===i.s)||{}).name)} series</span></span>
  <span class="chev" style="margin-left:auto">›</span></button>`).join('')}</div>`);
}
function pickQty(id){
 const it=DB.items.find(x=>x.id===id);window._q=5;window._ft=16;window._in=0;window._it=it;
 openSheet(`<div class="eyebrow">${esc(it.code)}</div><h2>${esc(it.name)}</h2>
 <div class="eyebrow" style="margin-top:18px">Length — feet and inches</div>
 <div class="chips" id="ftch">${FEET.map(f=>`<button class="chip ${f===16?'on':''}" onclick="setFt(${f})">${f} ft</button>`).join('')}
  <button class="chip" onclick="setFt(0)">std</button></div>
 <div class="chips" id="inch" style="margin-top:8px">${INCHES.map(n=>`<button class="chip ${n===0?'on':''}" onclick="setIn(${n})">${n} in</button>`).join('')}</div>
 <div class="note" id="lenPrev">Length: 16 ft</div>
 <div class="eyebrow" style="margin-top:18px">Pieces counted in</div>
 <div class="stp" style="margin-top:6px;width:fit-content"><button onclick="qStep(-1)">−</button><b id="qv">5</b><button onclick="qStep(1)">+</button></div>
 <button class="act" onclick="addCounted()">Add to the count</button>`);
}
function lenLabel(){return window._ft===0?'std':window._ft+' ft'+(window._in?' '+window._in+' in':'');}
function setFt(f){window._ft=f;document.querySelectorAll('#ftch .chip').forEach(c=>c.classList.toggle('on',c.textContent===(f===0?'std':f+' ft')));
 $('lenPrev').textContent='Length: '+lenLabel();}
function setIn(n){window._in=n;document.querySelectorAll('#inch .chip').forEach(c=>c.classList.toggle('on',c.textContent===n+' in'));
 $('lenPrev').textContent='Length: '+lenLabel();}
function qStep(n){window._q=Math.max(1,window._q+n);$('qv').textContent=window._q;}
function addCounted(){
 const it=window._it;
 S.draft.items.push({id:rid(),name:it.name,shape:it.shape,len:lenLabel(),qty:window._q});
 closeSheet();render();toast(`${it.name} — ${window._q} pieces added`);
}
/* BR1 + BR2 — the only place an inward number is created */
function vCreated(){
 const l=DB.lots.find(x=>x.no===S.lot);
 return `<div class="hero"><div class="sub" style="margin:0">Inward created</div><div class="big">${INW(l.no)}</div>
 <div class="cap">Verified and counted in by ${esc(l.verifiedBy)}<br>
 ${l.items.length} items · ${totalOf(l)} pieces · shade ${l.shade}${l.wooden?' · wooden coating':''}<br>
 This number now carries the lot to dispatch</div></div>
 <button class="act sf" onclick="go('tally',{lot:${l.no},stage:'wash'})">Start washing</button>
 <button class="act ghost" onclick="go('home')">Back to dashboard</button>`;
}
/* walk-in material — arrives without a driver */

 S.draft=S.draft||{party:DB.parties[0].id,vehicle:'',challan:'',shots:{}};
 const d=S.draft;
 return `<button class="back" onclick="S.draft=null;go('gate')">‹ Back</button>
 <div class="eyebrow">Walk-in material</div><h1>Gate entry</h1>
 <p class="sub">For material the customer delivers themselves, with no driver collection.</p>
 <div class="fld" style="margin-top:18px"><label>Customer</label>
  <select onchange="S.draft.party=this.value">${DB.parties.map(p=>`<option value="${p.id}" ${d.party===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div class="fld"><label>Vehicle number</label><input value="${esc(d.vehicle)}" oninput="S.draft.vehicle=this.value"></div>
 <div class="fld"><label>Party challan number</label><input value="${esc(d.challan)}" oninput="S.draft.challan=this.value"></div>
 <div class="fld"><label>Photos</label>
  <div class="shots">${shotTile('challan','Challan')}${shotTile('material','Material')}${shotTile('vehicle','Vehicle')}</div></div>
 <button class="act" ${d.vehicle.trim().length>5?'':'disabled'} onclick="doWalkin()">Add to the gate queue</button>`;
}

/* ══ LOTS + JOB CARD ══ */
function vLots(){
 return `<div class="eyebrow">Inward register</div><h1>All lots</h1>
 <p class="sub">${can('party.view')?'You are the owner, so customer names are visible.':'Party names are masked for your role. Only the number identifies the work.'}</p>
 <div class="rows stag" style="margin-top:16px">${DB.lots.map(l=>lotRow(l)).join('')}</div>`;
}
function vLot(){
 const l=DB.lots.find(x=>x.no===S.lot),s=shade(l.shade);
 const d=doneOf(l),t=totalOf(l);
 return `<button class="back" onclick="go('lots')">‹ Back</button>
 <div class="eyebrow">Inward number</div>
 <div style="font-family:var(--disp);font-weight:900;font-stretch:118%;font-size:48px;line-height:1;letter-spacing:-.045em;color:var(--blue)">${INW(l.no)}</div>
 <div class="pn">
  <div class="kv"><dt>Party</dt><dd>${seeParty(l)?esc(party(l.party).name):'<span class="masked">Masked</span>'}</dd></div>
  <div class="kv"><dt>Vehicle</dt><dd style="font-family:var(--mono);font-weight:400">${esc(l.vehicle)}</dd></div>
  <div class="kv"><dt>Challan</dt><dd style="font-family:var(--mono);font-weight:400">${esc(l.challan)}</dd></div>
  <div class="kv"><dt>Shade</dt><dd><span class="sd" style="background:${s.hex};display:inline-block;vertical-align:-8px;margin-right:8px"></span>${l.shade} ${esc(s.name)}</dd></div>
  <div class="kv"><dt>Wooden coating</dt><dd>${l.wooden?'Yes':'No'}</dd></div>
  <div class="kv"><dt>Verified by</dt><dd>${esc(l.verifiedBy)}</dd></div></div>
 <div class="eyebrow" style="margin-top:16px">Photos from the gate</div>
 ${shotStrip(l.photos)}
 ${l.delivery && l.delivery.pod ? `<div class="eyebrow" style="margin-top:16px">Proof of delivery</div>${shotStrip([l.delivery.pod])}` : ''}
 <div class="hr"></div><div class="eyebrow">Items · ${d} of ${t} pieces this stage</div>
 <table class="tb"><tr><th>Item</th><th>Length</th><th style="text-align:right">Qty</th></tr>
 ${l.items.map(i=>`<tr><td style="font-weight:600">${esc(i.name)}</td><td class="m stl">${esc(i.len)}</td>
  <td class="m" style="text-align:right">${countsFor(l)[i.id]||0}/${i.qty}</td></tr>`).join('')}</table>
 ${l.shortfalls.length?`<div class="hr"></div><div class="eyebrow">Shortfalls recorded</div>
  <table class="tb"><tr><th>Stage</th><th>Item</th><th>Reason</th><th style="text-align:right">Short</th></tr>
  ${l.shortfalls.map(f=>`<tr><td class="stl">${STAGE_NAME[f.stage]}</td><td>${esc(f.item)}</td>
   <td class="stl">${esc(f.reason)}</td><td class="m cop" style="text-align:right">${f.qty}</td></tr>`).join('')}</table>`:''}
 <div class="hr"></div><div class="eyebrow">Stage timeline</div>
 <div class="tl">${stagesOf(l).map(st=>{const lk=l.locks[st];const cls=lk?'d':l.stage===st?'a':'x';
  return `<div class="st ${cls}"><span class="bulb"></span><span><span class="nmm">${STAGE_NAME[st]}</span>
  <span class="dt">${lk?`Locked · ${esc(lk.by)} · ${esc(lk.at)}`:l.stage===st?'In progress':'Waiting'}</span></span></div>`}).join('')}
  <div class="st ${l.stage==='out'?'d':'x'}"><span class="bulb"></span><span><span class="nmm">Ready to dispatch</span>
  <span class="dt">${l.stage==='out'?(l.delivery&&l.delivery.receiver?'Delivered to '+esc(l.delivery.receiver)+' at '+esc(l.delivery.at):l.delivery?'Assigned to '+esc(driver(l.delivery.driver).name):'Awaiting a driver'):'Waiting'}</span></span></div></div>
 ${l.stage!=='out'
  ?`<button class="act sf" onclick="go('tally',{lot:${l.no},stage:'${l.stage}'})">Open tally screen — ${STAGE_NAME[l.stage]}</button>`
  :l.delivery&&l.delivery.receiver
   ?`<button class="act" disabled>Delivered · received by ${esc(l.delivery.receiver)}</button>`
   :can('driver.assign')
    ?`<button class="act ${l.delivery?'ghost':'sf'}" onclick="assignSheet(${l.no})">${l.delivery?'Assigned to '+esc(driver(l.delivery.driver).name)+' — change':'Assign a driver for delivery'}</button>`
    :`<button class="act" disabled>${l.delivery?'Assigned to '+esc(driver(l.delivery.driver).name):'Awaiting the owner to assign a driver'}</button>`}`;
}

/* ══ TALLY (BR6) ══ */
function vTally(){
 const l=DB.lots.find(x=>x.no===S.lot);
 if(l.stage==='out')return `<div class="empty">This lot is finished.</div><button class="act ghost" onclick="go('home')">Back</button>`;
 const st=l.stage,c=l.counts[st]||(l.counts[st]={});
 const d=doneOf(l),t=totalOf(l),full=d===t,s=shade(l.shade);
 return `<button class="back" onclick="go(me().role==='operator'?'home':'lot',{lot:${l.no}})">‹ Back</button>
 <div class="kbar"><span class="kn">${INW(l.no)}</span><span class="ks">${STAGE_NAME[st]}</span>
  <span class="sd" style="background:${s.hex};width:22px;height:22px"></span><span class="ks">${l.shade}</span>
  <span class="kc ${full?'ok':''}">${d} / ${t} done</span>
  <span class="prog"><i class="${full?'ok':''}" style="width:${t?d/t*100:0}%"></i></span></div>
 <div class="tiles">${l.items.map((i,n)=>{const done=c[i.id]||0;const cls=done>=i.qty?'full':done>0?'short':'';
  return `<button class="tile ${cls}" onclick="bump('${i.id}',1)">
   <span class="lvl" style="height:${i.qty?done/i.qty*100:0}%"></span>
   ${done>0?`<span class="minus" onclick="event.stopPropagation();bump('${i.id}',-1)">−</span>`:''}
   <span class="art"><span class="ph">PHOTO</span>${SHAPES[i.shape]||SHAPES.sect}</span>
   <span class="meta"><span class="nm">${esc(i.name)} · ${esc(i.len)}</span>
   <span class="ct ${S.bumped===i.id?'pop':''}">${done}<s>/${i.qty}</s></span></span>
   <span class="badge">${done>=i.qty?'done':(i.qty-done)+' missing'}</span></button>`}).join('')}</div>
 <div class="note">Tap a tile as each piece is finished. The tile fills as the count rises — press − to correct.<br>
  <b style="color:var(--blue)">No party name. The operator sees the number and the count, nothing else.</b></div>
 ${can('stage.lock')
  ?`<button class="act" onclick="lockSheet()">Tally &amp; lock stage</button>`
  :`<button class="act" disabled onclick="toast('Only a supervisor can lock a stage',true)">Tally &amp; lock — supervisor only</button>`}`;
}

/* ══ LOCK (BR4, BR5, BR7, BR9) ══ */
function lockSheet(){
 const l=DB.lots.find(x=>x.no===S.lot),c=countsFor(l);
 const short=l.items.filter(i=>(c[i.id]||0)<i.qty);
 const missing=short.reduce((s,i)=>s+(i.qty-(c[i.id]||0)),0);
 openSheet(`<div class="eyebrow">${STAGE_NAME[l.stage]} · lot ${INW(l.no)}</div>
 <h2>${short.length?'Short by '+missing+' pieces':'Full lot tallied'}</h2>
 ${short.length?`<div style="margin-top:10px">${short.map(i=>`<div class="miss"><span style="font-weight:600">${esc(i.name)} · ${esc(i.len)}</span>
   <b>${i.qty-(c[i.id]||0)} missing</b></div>`).join('')}</div>
  <div class="eyebrow" style="margin-top:18px">Reason — required</div>
  <div class="chips">${REASONS.map(r=>`<button class="chip ${S.reason===r?'on':''}" onclick="S.reason='${r}';lockSheet()">${r}</button>`).join('')}</div>`
  :`<p class="sub">Every piece is accounted for. Locking moves this lot to the next stage.</p>`}
 <button class="act" onclick="doLock()">Lock ${STAGE_NAME[l.stage]}</button>
 <button class="act ghost" onclick="closeSheet()">Keep working</button>`);
}

/* ══ COLOUR BATCH BOARD ══ */
function vColours(){
 const pend=c=>DB.lots.filter(l=>l.shade===c&&l.stage!=='out').length;
 return `<div class="eyebrow">Colour batch board</div><h1>One shade,<br>one pass</h1>
 <p class="sub">Changing colour is the slowest thing on the line. Pick a shade to see every lot waiting on it, across all customers.</p>
 <div class="shades stag">${DB.shades.map(s=>{const n=pend(s.code);
  return `<button class="sh" onclick="${n?`go('batch',{shade:'${s.code}'})`:`toast('No lots pending in ${s.code} ${s.name}')`}">
   <span class="sw" style="background:${s.hex}"><span class="cnt ${n?'':'z'}">${n}</span></span>
   <span class="lb"><span class="cd">${s.code}</span><span class="nmz">${esc(s.name)}</span></span></button>`}).join('')}</div>
 <div class="note">The number on each chip is how many lots are waiting in that shade.</div>`;
}
function vBatch(){
 const s=shade(S.shade),L=DB.lots.filter(l=>l.shade===S.shade&&l.stage!=='out');
 return `<button class="back" onclick="go('colours')">‹ Colour board</button>
 <div style="display:flex;align-items:center;gap:16px;margin-top:6px">
  <span style="width:60px;height:60px;border-radius:16px;background:${s.hex};flex:none;box-shadow:var(--sh2)"></span>
  <span><h1 style="font-size:27px">${esc(s.name)} ${s.code}</h1>
  <span class="sub" style="display:block;margin-top:4px">${L.length} lots waiting on this shade</span></span></div>
 <div class="rows stag" style="margin-top:18px">${L.map(l=>lotRow(l,`go('tally',{lot:${l.no},stage:'${l.stage}'})`)).join('')}</div>
 <div class="callout">One powder change instead of ${L.length}. Run every lot on this list in a single pass.</div>`;
}

/* ══ ASSIGN A DRIVER ══ */
function assignSheet(no){
 const l=DB.lots.find(x=>x.no===no);
 openSheet(`<div class="eyebrow">Lot ${INW(l.no)} · ready to dispatch</div><h2>Assign a driver</h2>
 <p class="sub">The driver will see this customer's name and address only until the delivery is completed.</p>
 <div class="mlist">${DB.drivers.filter(d=>d.active).map(d=>`<button class="mrow ${l.delivery&&l.delivery.driver===d.id?'on':''}"
  onclick="assignTo(${l.no},'${d.id}')"><span class="mk">${esc(d.id.toUpperCase())}</span>
  <span><b>${esc(d.name)}</b><span style="display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted)">${esc(d.phone)} · ${esc(d.vehicle||'')}</span></span>
  <span class="chev" style="margin-left:auto">›</span></button>`).join('')}</div>`);
}

/* ══ REPORTS ══ */
function vReports(){
 const awaiting=DB.lots.filter(l=>l.stage==='out'&&(!l.delivery||!l.delivery.receiver));
 const done=DB.lots.filter(l=>l.delivery&&l.delivery.receiver);
 const shorts=[];DB.lots.forEach(l=>l.shortfalls.forEach(f=>shorts.push({...f,no:l.no})));
 return `<div class="eyebrow">Reports</div><h1>Dispatch and<br>shortfall</h1>
 <p class="sub">Two registers are included in this build. The others are listed as optional additions in the quotation.</p>
 <div class="hr"></div><div class="eyebrow">Awaiting dispatch · ${awaiting.length}</div>
 ${awaiting.length?`<div class="rows">${awaiting.map(l=>lotRow(l)).join('')}</div>`:'<div class="empty">Nothing waiting to go out.</div>'}
 <div class="hr"></div><div class="eyebrow">Delivered · ${done.length}</div>
 ${done.length?`<table class="tb"><tr><th>Lot</th><th>Customer</th><th>Driver</th><th>Received by</th></tr>
  ${done.map(l=>`<tr><td class="m bl">${INW(l.no)}</td><td>${esc(partyName(l))}</td>
   <td class="stl">${esc(driver(l.delivery.driver).name)}</td><td>${esc(l.delivery.receiver)}<br>
   <span class="stl" style="font-size:11.5px">${esc(l.delivery.at)}</span></td></tr>`).join('')}</table>`

/* ── Turn a login on or off ───────────────────────────────────────
   BR8 — nothing is deleted. A login is deactivated, and the record
   of everything they did stays intact. */
async function setActive(uid, active, label){
  if (!can('admin')){ toast('Only the owner can do this', true); return; }
  if (uid === me().uid){ toast('You cannot disable your own login', true); return; }
  try{
    await updateDoc(doc(fs,'users',uid), { active });
    await logIt(active ? 'Re-enabled a login' : 'Disabled a login', label);
    if (!active) await refreshDriverList();
    toast(label + (active ? ' can sign in again' : ' can no longer sign in'));
  }catch(e){ toast('Could not change — ' + e.code, true); }
}
async function setRole(uid, role, label){
  if (!can('admin')){ toast('Only the owner can do this', true); return; }
  if (uid === me().uid){ toast('You cannot change your own role', true); return; }
  try{
    await updateDoc(doc(fs,'users',uid), { role });
    await logIt('Changed a role', label + ' → ' + role);
    closeSheet(); toast(label + ' is now ' + role);
  }catch(e){ toast('Could not change — ' + e.code, true); }
}

/* ══ CREDENTIALS ══════════════════════════════════════════════════
   Passwords and PINs are stored one-way hashed by Firebase. Nobody can
   read them back — not the owner, not Sangam, not Google. That is what
   makes the promise in the quotation true rather than decorative.

   So instead of showing a password, the owner ISSUES a new one. The
   card below is shown once, at the moment of issue, to write down or
   hand over. */

let LAST_ISSUED = null;   // held in memory only, cleared on sign out

function credCard(name, who, secret, kind){
  LAST_ISSUED = { name, who, secret, kind };
  openSheet(`<div class="eyebrow">Write this down now</div><h2>${esc(name)}</h2>
   <p class="sub" style="margin-top:0">This is the only time it can be shown. It is not stored anywhere, and nobody can read it back later — including you.</p>
   <div class="pn" style="margin-top:14px">
    <div class="kv"><dt>${kind === 'pin' ? 'Phone' : 'Username'}</dt>
     <dd style="font-family:var(--mono);font-size:15px">${esc(who)}</dd></div>
    <div class="kv"><dt>${kind === 'pin' ? 'PIN' : 'Password'}</dt>
     <dd style="font-family:var(--mono);font-size:17px;color:var(--blue)">${esc(secret)}</dd></div>
   </div>
   <button class="act" onclick="copyCreds()">Copy to send on WhatsApp</button>
   <button class="act ghost" onclick="closeSheet()">I have written it down</button>`);
}
function copyCreds(){
  if (!LAST_ISSUED) return;
  const c = LAST_ISSUED;
  const text = `Classic Powder Coating — your login\n` +
    (c.kind === 'pin' ? `Phone: ${c.who}\nPIN: ${c.secret}\nOpen the app, choose Driver, then your name.`
                      : `Username: ${c.who}\nPassword: ${c.secret}\nOpen the app, Staff tab.`) +
    `\n${location.origin}`;
  navigator.clipboard.writeText(text).then(
    () => toast('Copied — paste it into WhatsApp'),
    () => toast('Could not copy. Write it down instead.', true));
}

/* Re-issue a staff login whose password has been forgotten. Same one
   manual step as a driver: the old login is removed in the console,
   then re-created here. */
function reissueStaffSheet(uid){
  const u = DB.users.find(x => (x.uid||x.id) === uid); if (!u) return;
  openSheet(`<div class="eyebrow">${esc(u.username||'')}</div><h2>${esc(u.name)} forgot the password</h2>
  <p class="sub" style="margin-top:0">Passwords cannot be read back by anyone. Issue a new one instead — it takes one step in the Firebase console.</p>
  <div class="callout" style="margin-top:14px">
   <b>Step 1.</b> Firebase console &rarr; Authentication &rarr; Users.<br>
   Find <b>${esc(u.username||'')}@cpc.local</b> and delete it.<br><br>
   <b>Step 2.</b> Come back here and press the button below.
  </div>
  <div class="fld" style="margin-top:16px"><label>New password — at least 8 characters</label>
   <input id="rs_pw" value="Cpc-${esc((u.name||'x').split(' ')[0])}-${new Date().getFullYear()}"></div>
  <button class="act" onclick="reissueStaff('${uid}')">Re-create the login</button>`);
}
async function reissueStaff(uid){
  const u = DB.users.find(x => (x.uid||x.id) === uid);
  const pw = ($('rs_pw').value||'').trim();
  if (pw.length < 8){ toast('At least 8 characters', true); return; }
  try{
    const cred = await createUserWithEmailAndPassword(seedAuth, u.username + '@cpc.local', pw);
    await setDoc(doc(fs,'users',cred.user.uid), {
      name:u.name, role:u.role, username:u.username, active:true });
    await updateDoc(doc(fs,'users',uid), { active:false });
    await fbSignOut(seedAuth);
    await logIt('Re-issued a staff login', u.name);
    credCard(u.name, u.username, pw, 'password');
  }catch(e){
    toast(e.code === 'auth/email-already-in-use'
      ? 'Delete the old login in Firebase first, then try again'
      : 'Could not re-create — ' + (e.code||e.message), true);
  }
}

        <span style="color:${done?'var(--green)':'var(--faint)'};font-weight:700">${done?'✓':'○'}</span>
        <span style="color:${done?'var(--muted)':'var(--ink)'}">${t}</span></div>`).join('')}
   </div>
  </div>` : ''}`;
}

function passwordSheet(){
  if (me().role === 'driver'){ changePinSheet(); return; }
  openSheet(`<div class="eyebrow">Your login</div><h2>Change your password</h2>
  <p class="sub" style="margin-top:0">At least 8 characters. Use something that is not a date or a run of digits.</p>
  <div class="fld" style="margin-top:16px"><label>Current password</label><input id="pw_old" type="password"></div>
  <div class="fld"><label>New password</label><input id="pw_new" type="password"></div>
  <button class="act" onclick="doChangePassword()">Save new password</button>`);
}
async function doChangePassword(){
  const oldPw = $('pw_old').value || '', newPw = $('pw_new').value || '';
  if (newPw.length < 8){ toast('At least 8 characters', true); return; }
  if (/^\d+$/.test(newPw)){ toast('Digits alone are too easy to guess', true); return; }
  try{
    const cred = EmailAuthProvider.credential(auth.currentUser.email, oldPw);
    await reauthenticateWithCredential(auth.currentUser, cred);
    await updatePassword(auth.currentUser, newPw);
    await logIt('Changed own password');
    closeSheet(); toast('Password changed. Use the new one next time.');
  }catch(e){
    toast(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password'
      ? 'Current password is wrong' : 'Could not change — ' + e.code, true);
  }
}

function counterSheet(){
  openSheet(`<div class="eyebrow">Inward numbering</div><h2>Set the starting number</h2>
  <p class="sub" style="margin-top:0">Ask the client the last inward number they wrote by hand. Enter that number here, and the next lot will be the one after it.</p>
  <div class="fld" style="margin-top:16px"><label>Last number already used</label>
   <input id="ct_v" inputmode="numeric" value="${DB.counter}"></div>
  <div class="note">Currently the next lot would be ${INW(DB.counter + 1)}.</div>
  <button class="act" onclick="saveCounter()">Save</button>`);
}
async function saveCounter(){
  const v = parseInt(($('ct_v').value||'').replace(/\D/g,''), 10);
  if (!v || v < DB.counter){
    toast('Enter a number that is ' + DB.counter + ' or higher — it can never go down', true); return;
  }
  try{
    await updateDoc(doc(fs,'meta','counter'), { inwardNo: v });
    await logIt('Set the inward starting number', 'next lot will be ' + INW(v+1));
    closeSheet(); toast('Next lot will be ' + INW(v+1));
  }catch(e){ toast('Could not save — ' + e.code, true); }
}

/* ── A driver who has forgotten his PIN ───────────────────────────
   A PIN is a real password, so no browser can overwrite someone
   else's. This walks the owner through the one manual step. */
function reissueSheet(uid){
  const d = DB.drivers.find(x => (x.uid||x.id) === uid); if (!d) return;
  openSheet(`<div class="eyebrow">${esc(d.phone||'')}</div><h2>${esc(d.name)} forgot his PIN</h2>
  <p class="sub" style="margin-top:0">A PIN is a real password, so nobody — not even you — can read or overwrite it. Re-issuing takes one step in the Firebase console.</p>
  <div class="callout" style="margin-top:14px">
   <b>Step 1.</b> Firebase console &rarr; Authentication &rarr; Users.<br>
   Find <b>${esc((d.phone||'').replace(/\D/g,''))}@drivers.cpc.local</b> and delete it.<br><br>
   <b>Step 2.</b> Come back here and press the button below.
  </div>
  <div class="fld" style="margin-top:16px"><label>New 4-digit PIN</label>
   <input id="ri_pin" maxlength="4" inputmode="numeric"></div>
  <button class="act" onclick="reissueDriver('${uid}')">Re-create his login</button>`);
}
async function reissueDriver(uid){
  const d = DB.drivers.find(x => (x.uid||x.id) === uid);
  const pin = ($('ri_pin').value||'').trim();
  if (weakPin(pin)){ toast('Choose a stronger 4-digit PIN', true); return; }
  try{
    const cred = await createUserWithEmailAndPassword(seedAuth, driverEmail(d.phone), driverPass(pin));
    await setDoc(doc(fs,'users',cred.user.uid), {
      name: d.name, role: 'driver', phone: d.phone, vehicle: d.vehicle || '', active: true });
    await updateDoc(doc(fs,'users',uid), { active: false });   // BR8 — the old record stays
    await fbSignOut(seedAuth);
    await refreshDriverList();
    await logIt('Re-issued a driver login', d.name);
    credCard(d.name, d.phone, pin, 'pin');
  }catch(e){
    toast(e.code === 'auth/email-already-in-use'
      ? 'Delete the old login in Firebase first, then try again'
      : 'Could not re-create — ' + (e.code||e.message), true);
  }
}
